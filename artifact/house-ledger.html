<title>House Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --paper: #f1efe6;
    --paper-raised: #ffffff;
    --ink: #23262f;
    --ink-soft: #5b5f6b;
    --ink-faint: #8b8f9a;
    --line: #ddd8cc;
    --line-soft: #e8e4d9;
    --accent: #a6742c;
    --accent-ink: #6f4d1c;
    --accent-soft: #f0e3c8;
    --navy: #1f3350;
    --navy-soft: #e4eaf1;
    --good: #3f7d5c;
    --good-soft: #e2efe7;
    --warning: #bf7a28;
    --warning-soft: #f5e7d2;
    --critical: #b0483f;
    --critical-soft: #f5e0dd;
    --shadow: 0 1px 2px rgba(35,38,47,0.06), 0 6px 20px -8px rgba(35,38,47,0.18);
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #16181e;
      --paper-raised: #1f232b;
      --ink: #eceae3;
      --ink-soft: #a6abb8;
      --ink-faint: #767c89;
      --line: #333846;
      --line-soft: #262b36;
      --accent: #d3a75c;
      --accent-ink: #f0d9a8;
      --accent-soft: #3a301c;
      --navy: #7fa0c9;
      --navy-soft: #202b3d;
      --good: #6cbb92;
      --good-soft: #1c2f26;
      --warning: #dc9c50;
      --warning-soft: #382c19;
      --critical: #e0837a;
      --critical-soft: #3a2320;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #16181e;
    --paper-raised: #1f232b;
    --ink: #eceae3;
    --ink-soft: #a6abb8;
    --ink-faint: #767c89;
    --line: #333846;
    --line-soft: #262b36;
    --accent: #d3a75c;
    --accent-ink: #f0d9a8;
    --accent-soft: #3a301c;
    --navy: #7fa0c9;
    --navy-soft: #202b3d;
    --good: #6cbb92;
    --good-soft: #1c2f26;
    --warning: #dc9c50;
    --warning-soft: #382c19;
    --critical: #e0837a;
    --critical-soft: #3a2320;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    padding: 0 20px 64px;
  }
  .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; text-wrap: balance; margin: 0; }
  a { color: var(--accent-ink); }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }

  /* ---- shell ---- */
  .topbar {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; gap: 20px;
    padding-block: 22px 14px;
    flex-wrap: wrap;
  }
  .wordmark { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .wordmark h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .wordmark .tag { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .tabs { display: flex; gap: 4px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
  .tabs button {
    border: none; background: transparent; color: var(--ink-soft);
    padding: 7px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 500;
  }
  .tabs button.active { background: var(--ink); color: var(--paper-raised); }
  .identity { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .identity .chip { font-weight: 600; color: var(--ink); }
  .identity button { border: none; background: none; color: var(--accent-ink); font-size: 12.5px; text-decoration: underline; padding: 0; }

  main { max-width: 1180px; margin: 0 auto; }

  /* ---- identity gate ---- */
  .gate {
    max-width: 420px; margin: 12vh auto; background: var(--paper-raised);
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 32px; text-align: center;
  }
  .gate h2 { font-size: 24px; margin-bottom: 8px; }
  .gate p { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; line-height: 1.5; }
  .gate input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: 14px; margin-bottom: 12px; }
  .gate button.primary { width: 100%; }

  button.primary {
    background: var(--ink); color: var(--paper-raised); border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 13.5px; font-weight: 600;
  }
  button.ghost {
    background: transparent; border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 9px 16px; font-size: 13.5px; font-weight: 500;
  }
  button.ghost:hover { border-color: var(--ink-faint); }
  button.icon-btn { background: none; border: none; color: var(--ink-faint); font-size: 15px; padding: 4px; line-height: 1; }
  button.icon-btn:hover { color: var(--ink); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---- toolbar row ---- */
  .toolbar { display: flex; align-items: center; gap: 12px; margin: 10px 0 20px; flex-wrap: wrap; }
  .toolbar .count { font-size: 13px; color: var(--ink-faint); margin-right: auto; }
  .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-pill {
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-soft);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 500;
  }
  .filter-pill.active { background: var(--navy-soft); border-color: var(--navy); color: var(--navy); }

  /* ---- house grid ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px;
    position: relative; cursor: pointer; transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--accent); }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .card-check { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
  .card-addr { font-size: 16.5px; font-weight: 600; line-height: 1.25; flex: 1; }
  .status-pill { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .status-interested { background: var(--navy-soft); color: var(--navy); }
  .status-touring { background: var(--accent-soft); color: var(--accent-ink); }
  .status-offer { background: var(--warning-soft); color: var(--warning); }
  .status-passed { background: var(--critical-soft); color: var(--critical); }
  select.status-select {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent;
    -webkit-appearance: none; appearance: none; cursor: pointer; font-family: inherit;
  }
  select.status-select.status-interested { background: var(--navy-soft); color: var(--navy); }
  select.status-select.status-touring { background: var(--accent-soft); color: var(--accent-ink); }
  select.status-select.status-offer { background: var(--warning-soft); color: var(--warning); }
  select.status-select.status-passed { background: var(--critical-soft); color: var(--critical); }
  .flip-badge {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    background: var(--warning-soft); color: var(--warning); border-radius: 999px; padding: 3px 9px;
    cursor: help; white-space: nowrap;
  }
  .stat-row { display: flex; gap: 14px; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap; }
  .stat-row .num { color: var(--ink); font-weight: 500; }
  .stat-row .price { font-size: 15px; font-weight: 600; color: var(--ink); }
  .links-row { display: flex; gap: 10px; font-size: 12px; }
  .links-row a { text-decoration: none; }
  .links-row a:hover { text-decoration: underline; }
  .ratings-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .rating-chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
    background: var(--line-soft); color: var(--ink-soft); border-radius: 999px; padding: 3px 9px 3px 6px;
  }
  .rating-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .rating-chip .val { color: var(--ink); font-family: 'IBM Plex Mono', monospace; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-faint); }
  .empty-state h3 { color: var(--ink-soft); font-size: 19px; margin-bottom: 6px; }

  /* ---- floating compare bar ---- */
  .compare-bar {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper-raised); border-radius: 999px;
    padding: 10px 10px 10px 20px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 10px 30px -6px rgba(0,0,0,0.4); z-index: 40; font-size: 13.5px;
  }
  .compare-bar button.primary { background: var(--accent); color: #241a08; padding: 8px 16px; }

  /* ---- drawer (add / detail) ---- */
  .overlay { position: fixed; inset: 0; background: rgba(20,20,24,0.4); z-index: 50; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 100vw);
    background: var(--paper); border-left: 1px solid var(--line); z-index: 51;
    overflow-y: auto; box-shadow: -12px 0 40px -12px rgba(0,0,0,0.3);
  }
  .drawer-head {
    position: sticky; top: 0; background: var(--paper); border-bottom: 1px solid var(--line);
    padding: 18px 22px; display: flex; align-items: center; gap: 12px; z-index: 2;
  }
  .drawer-head h2 { font-size: 19px; flex: 1; }
  .drawer-body { padding: 20px 22px 40px; display: flex; flex-direction: column; gap: 22px; }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); }
  .field input, .field select, .field textarea {
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink);
    border-radius: 7px; padding: 8px 10px; font-size: 13.5px; width: 100%;
  }
  .field textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  section.block { border-top: 1px solid var(--line-soft); padding-top: 18px; }
  section.block h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 12px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; }

  .eval-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .eval-columns, .field-grid { grid-template-columns: 1fr; } }
  .eval-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .eval-card.mine { border-color: var(--accent); }
  .eval-card .who { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .eval-card .who .dot { width: 9px; height: 9px; border-radius: 50%; }
  .rating-scale { display: flex; align-items: center; gap: 10px; }
  .rating-scale input[type=range] { flex: 1; accent-color: var(--accent); }
  .rating-scale .rval { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; min-width: 28px; text-align: right; }
  .pn-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pn-cols label { font-size: 10.5px; }
  .pn-cols textarea { min-height: 70px; font-size: 12.5px; }
  .pn-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .pn-list li { padding-left: 14px; position: relative; }
  .pn-list.pos li::before { content: "+"; position: absolute; left: 0; color: var(--good); font-weight: 700; }
  .pn-list.neg li::before { content: "\2212"; position: absolute; left: 0; color: var(--critical); font-weight: 700; }
  .empty-eval { color: var(--ink-faint); font-size: 12.5px; text-align: center; padding: 18px 0; }

  .row-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* ---- compare view ---- */
  .compare-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-raised); box-shadow: var(--shadow); }
  table.compare { border-collapse: collapse; width: 100%; min-width: 560px; }
  table.compare th, table.compare td { padding: 11px 16px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; font-size: 13.5px; }
  table.compare th.rowlabel, table.compare td.rowlabel { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); font-weight: 600; white-space: nowrap; background: var(--paper); position: sticky; left: 0; }
  table.compare thead th { background: var(--paper); border-bottom: 1px solid var(--line); }
  table.compare .col-addr { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; }
  table.compare td.best { background: var(--good-soft); font-weight: 600; color: var(--good); }
  table.compare .rm-col { background: none; border: none; color: var(--ink-faint); font-size: 13px; }

  /* ---- ranked view ---- */
  .rank-list { display: flex; flex-direction: column; gap: 10px; }
  .rank-row { display: flex; align-items: center; gap: 16px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .rank-num { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: var(--accent); width: 34px; text-align: center; flex-shrink: 0; }
  .rank-main { flex: 1; min-width: 0; }
  .rank-addr { font-weight: 600; font-size: 15px; }
  .rank-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .rank-score { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; text-align: right; }
  .rank-score .lbl { display: block; font-size: 9.5px; text-transform: uppercase; color: var(--ink-faint); font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; letter-spacing: 0.05em; }
  .rank-move { display: flex; flex-direction: column; }

  .sort-toggle { display: flex; gap: 6px; }

  /* ---- property details / research ---- */
  .detail-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 20px; }
  .detail-stat { display: flex; flex-direction: column; gap: 2px; }
  .detail-stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 600; }
  .detail-stat .v { font-size: 14px; font-weight: 600; }

  .school-list { display: flex; flex-direction: column; gap: 8px; }
  .school-row { display: flex; align-items: center; gap: 10px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
  .school-row .info { flex: 1; min-width: 0; }
  .school-row .name { font-weight: 600; font-size: 13.5px; }
  .school-row .meta { font-size: 11.5px; color: var(--ink-soft); }
  .school-rating { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 12.5px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .school-rating.good { background: var(--good-soft); color: var(--good); }
  .school-rating.warning { background: var(--warning-soft); color: var(--warning); }
  .school-rating.critical { background: var(--critical-soft); color: var(--critical); }

  table.history-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.history-table th, table.history-table td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line-soft); }
  table.history-table th { font-size: 10.5px; text-transform: uppercase; color: var(--ink-faint); letter-spacing: 0.04em; }

  .agent-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .agent-card .name { font-weight: 600; font-size: 14.5px; }
  .agent-card .meta { color: var(--ink-soft); font-size: 12.5px; margin-top: 3px; }

  .section-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-head-row h3 { margin: 0; }
  .no-data { color: var(--ink-faint); font-size: 12.5px; }
</style>

<div id="app"></div>

<script>
(function () {
  const PALETTE = ['#a6742c', '#1f3350', '#3f7d5c', '#b0483f', '#5b5f6b', '#7a5ca6'];
  const STATUS_LABEL = { interested: 'Interested', touring: 'Touring', offer: 'Offer Made', passed: 'Passed' };

  function slug(s) {
    return (s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'anon';
  }
  function colorFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtMoney(n) {
    if (n == null || n === '') return '—';
    const num = Number(n);
    if (Number.isNaN(num)) return esc(n);
    return '$' + Math.round(num).toLocaleString('en-US');
  }
  function fmtNum(n, suffix) {
    if (n == null || n === '') return '—';
    const num = Number(n);
    if (Number.isNaN(num)) return esc(n);
    return num.toLocaleString('en-US') + (suffix || '');
  }
  function linesToArray(text) {
    return (text || '').split('\n').map(s => s.trim()).filter(Boolean);
  }
  function parsePipeRows(text, keys) {
    return (text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
      const parts = line.split('|').map(p => p.trim());
      const obj = {};
      keys.forEach((k, i) => obj[k] = parts[i] || '');
      return obj;
    });
  }
  function toPipeLines(arr, keys) {
    return (arr || []).map(o => keys.map(k => o[k] || '').join(' | ')).join('\n');
  }
  function ratingClass(ratingStr) {
    const n = parseFloat(ratingStr);
    if (Number.isNaN(n)) return '';
    if (n >= 8) return 'good';
    if (n >= 5) return 'warning';
    return 'critical';
  }

  // ---------------- state ----------------
  let db = null;
  let identity = localStorage.getItem('hh_name') || '';
  let tab = 'houses';
  let statusFilter = 'all';
  let houses = new Map();      // id -> data
  let evaluations = new Map(); // houseId -> Map(personSlug -> data)
  let evalUnsubs = new Map();  // houseId -> unsub fn
  let selected = new Set();    // house ids selected for compare
  let compareIds = [];         // ids actively shown in compare tab
  let rankMode = 'score';      // 'score' | 'manual'
  let openDrawer = null;       // null | {type:'add'} | {type:'detail', id}
  let ready = false;

  const app = document.getElementById('app');

  function render() {
    if (!identity) { renderGate(); return; }
    let html = renderTopbar();
    html += '<main>';
    if (!ready) {
      html += '<div class="empty-state">Loading your ledger…</div>';
    } else if (tab === 'houses') {
      html += renderHouses();
    } else if (tab === 'compare') {
      html += renderCompare();
    } else if (tab === 'ranked') {
      html += renderRanked();
    }
    html += '</main>';
    if (tab === 'houses' && selected.size >= 2) html += renderCompareBar();
    app.innerHTML = html;
    bindGlobal();
    if (openDrawer) renderDrawerInto();
  }

  function renderGate() {
    app.innerHTML = `
      <div class="gate">
        <h2>House Ledger</h2>
        <p>Enter your name so your ratings and notes stay yours as you and your co-buyer evaluate houses together.</p>
        <input id="gate-input" placeholder="e.g. Alex" autofocus />
        <button class="primary" id="gate-go">Start evaluating</button>
      </div>`;
    const input = document.getElementById('gate-input');
    const go = () => {
      const v = input.value.trim();
      if (!v) { input.focus(); return; }
      localStorage.setItem('hh_name', v);
      identity = v;
      render();
      boot();
    };
    document.getElementById('gate-go').onclick = go;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }

  function renderTopbar() {
    return `
      <div class="topbar">
        <div class="wordmark">
          <h1>House Ledger</h1>
          <span class="tag">shared evaluation</span>
        </div>
        <div class="tabs">
          <button data-tab="houses" class="${tab === 'houses' ? 'active' : ''}">Houses</button>
          <button data-tab="compare" class="${tab === 'compare' ? 'active' : ''}">Compare</button>
          <button data-tab="ranked" class="${tab === 'ranked' ? 'active' : ''}">Ranked</button>
        </div>
        <div class="identity">
          Evaluating as <span class="chip">${esc(identity)}</span>
          <button id="change-identity">switch</button>
        </div>
      </div>`;
  }

  function bindGlobal() {

    app.querySelectorAll('.rank-up').forEach(b => b.onclick = () => moveRank(b.dataset.id, -1));
    app.querySelectorAll('.rank-down').forEach(b => b.onclick = () => moveRank(b.dataset.id, 1));

  // ---------------- houses view ----------------
  function sortedHouseList() {
    return Array.from(houses.entries())
      .filter(([id, h]) => statusFilter === 'all' || (h.status || 'interested') === statusFilter)
      .sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  }

  function avgRating(id) {
    const evs = evaluations.get(id);
    if (!evs || evs.size === 0) return null;
    let sum = 0, n = 0;
    evs.forEach(e => { if (typeof e.rating === 'number') { sum += e.rating; n++; } });
    return n ? sum / n : null;
  }

  // Flags a likely flip: bought, then relisted within ~18mo at a meaningfully higher price.
  function detectFlip(h) {
    const hist = (h.saleHistory || [])
      .map(r => ({ ...r, ts: Date.parse(r.date) }))
      .filter(r => !Number.isNaN(r.ts))
      .sort((a, b) => b.ts - a.ts);
    const soldIdx = hist.findIndex(r => r.event === 'Sold' && r.price);
    if (soldIdx === -1) return null;
    const sold = hist[soldIdx];
    const relist = hist.slice(0, soldIdx).reverse().find(r => r.event === 'Listed' && r.price);
    if (!relist) return null;
    const months = (relist.ts - sold.ts) / (1000 * 60 * 60 * 24 * 30);
    const pctUp = (relist.price - sold.price) / sold.price;
    if (months >= 0 && months <= 18 && pctUp >= 0.08) {
      return { boughtPrice: sold.price, boughtDate: sold.date, listedPrice: relist.price, listedDate: relist.date, months: Math.round(months), pctUp };
    }
    return null;
  }

  // ---------------- compare view ----------------
  function renderCompare() {
    const ids = compareIds.filter(id => houses.has(id));
    if (ids.length < 2) {
      return `<div class="empty-state"><h3>Nothing to compare yet</h3><p>Go to Houses, check 2–4 you want side by side, then hit Compare.</p></div>`;
    }
    const rows = [
      { key: 'price', label: 'Price', fmt: fmtMoney, lower: true },
      { key: 'sqft', label: 'Sqft', fmt: v => fmtNum(v), higher: true },
      { key: '$/sqft', label: '$ / sqft', fmt: v => v == null ? '—' : '$' + Math.round(v), lower: true, derived: true },
      { key: 'beds', label: 'Beds', fmt: v => fmtNum(v), higher: true },
      { key: 'baths', label: 'Baths', fmt: v => fmtNum(v), higher: true },
      { key: 'lotSize', label: 'Lot size', fmt: v => fmtNum(v, ' sqft'), higher: true },
      { key: 'yearBuilt', label: 'Year built', fmt: v => fmtNum(v), higher: true },
      { key: 'hoa', label: 'HOA / mo', fmt: fmtMoney, lower: true },
      { key: 'taxes', label: 'Property tax / yr', fmt: fmtMoney, lower: true },
      { key: 'status', label: 'Status', fmt: v => STATUS_LABEL[v || 'interested'] },
    ];

    function derivedVal(h, key) {
      if (key === '$/sqft') return (h.price && h.sqft) ? h.price / h.sqft : null;
      return h[key];
    }

    let html = '<div class="compare-wrap"><table class="compare"><thead><tr><th class="rowlabel"></th>';
    for (const id of ids) {
      html += `<th><div class="col-addr">${esc(houses.get(id).address)}</div><button class="rm-col rm-compare" data-id="${id}">remove ✕</button></th>`;
    }
    html += '</tr></thead><tbody>';

    for (const row of rows) {
      const vals = ids.map(id => derivedVal(houses.get(id), row.key));
      let best = null;
      const numericVals = vals.filter(v => typeof v === 'number' && !Number.isNaN(v));
      if (numericVals.length > 1 && (row.higher || row.lower)) {
        best = row.higher ? Math.max(...numericVals) : Math.min(...numericVals);
      }
      html += `<tr><td class="rowlabel">${row.label}</td>`;
      vals.forEach(v => {
        const isBest = best !== null && typeof v === 'number' && v === best;
        html += `<td class="${isBest ? 'best' : ''}">${row.fmt(v)}</td>`;
      });
      html += '</tr>';
    }

    // ratings per person
    const people = new Set();
    ids.forEach(id => { const evs = evaluations.get(id); if (evs) evs.forEach(e => people.add(e.person)); });
    people.forEach(person => {
      const vals = ids.map(id => {
        const evs = evaluations.get(id);
        const e = evs && Array.from(evs.values()).find(x => x.person === person);
        return e ? e.rating : null;
      });
      const numericVals = vals.filter(v => typeof v === 'number');
      const best = numericVals.length > 1 ? Math.max(...numericVals) : null;
      html += `<tr><td class="rowlabel">${esc(person)}'s rating</td>`;
      vals.forEach(v => html += `<td class="${best !== null && v === best ? 'best' : ''}">${v == null ? '—' : v + ' / 10'}</td>`);
      html += '</tr>';
    });

    // pros / cons
    html += `<tr><td class="rowlabel">Positives</td>`;
    ids.forEach(id => {
      const evs = evaluations.get(id);
      const all = evs ? Array.from(evs.values()).flatMap(e => e.positives || []) : [];
      html += `<td>${all.length ? '<ul class="pn-list pos">' + all.map(p => `<li>${esc(p)}</li>`).join('') + '</ul>' : '—'}</td>`;
    });
    html += '</tr>';
    html += `<tr><td class="rowlabel">Negatives</td>`;
    ids.forEach(id => {
      const evs = evaluations.get(id);
      const all = evs ? Array.from(evs.values()).flatMap(e => e.negatives || []) : [];
      html += `<td>${all.length ? '<ul class="pn-list neg">' + all.map(p => `<li>${esc(p)}</li>`).join('') + '</ul>' : '—'}</td>`;
    });
    html += '</tr>';

    html += '</tbody></table></div>';
    return html;
  }

  // ---------------- ranked view ----------------
  function moveRank(id, dir) {
    const list = sortedForRank();
    const idx = list.findIndex(([hid]) => hid === id);
    const swapIdx = idx + dir;
    if (swapIdx < 0 || swapIdx >= list.length) return;
    const a = list[idx], b = list[swapIdx];
    const aOrder = a[1].sortOrder ?? 0, bOrder = b[1].sortOrder ?? 0;
    db.collection('houses').doc(a[0]).update({ sortOrder: bOrder });
    db.collection('houses').doc(b[0]).update({ sortOrder: aOrder });
  }

  function sortedForRank() {
    const list = Array.from(houses.entries());
    if (rankMode === 'manual') {
      return list.sort((a, b) => (a[1].sortOrder ?? 0) - (b[1].sortOrder ?? 0));
    }
    return list.sort((a, b) => {
      const sa = avgRating(a[0]), sb = avgRating(b[0]);
      if (sa == null && sb == null) return 0;
      if (sa == null) return 1;
      if (sb == null) return -1;
      return sb - sa;
    });
  }

  function renderRanked() {
    const list = sortedForRank();
    if (list.length === 0) return `<div class="empty-state"><h3>Nothing ranked yet</h3><p>Add houses and rate them to see them here.</p></div>`;
    let html = `
      <div class="toolbar">
        <span class="count">Ranked by ${rankMode === 'manual' ? 'your manual order' : 'combined rating'}</span>
        <div class="sort-toggle filter-pills">
          <button class="filter-pill ${rankMode === 'score' ? 'active' : ''}" data-mode="score">By rating</button>
          <button class="filter-pill ${rankMode === 'manual' ? 'active' : ''}" data-mode="manual">Manual order</button>
        </div>
      </div>
      <div class="rank-list">`;
    list.forEach(([id, h], i) => {
      const score = avgRating(id);
      const evs = evaluations.get(id);
      const breakdown = evs && evs.size ? Array.from(evs.values()).map(e => `${e.person}: ${e.rating ?? '–'}`).join(' · ') : 'No ratings yet';
      html += `
        <div class="rank-row" data-id="${id}">
          <div class="rank-num">${i + 1}</div>
          <div class="rank-main">
            <div class="rank-addr">${esc(h.address)}</div>
            <div class="rank-sub">${fmtMoney(h.price)} · ${STATUS_LABEL[h.status || 'interested']} · ${esc(breakdown)}</div>

          ${rankMode === 'manual' ? `
            <div class="rank-move">
              <button class="icon-btn rank-up" data-id="${id}" ${i === 0 ? 'disabled' : ''}>▲</button>

            </div>` : `
            <div class="rank-score"><span class="lbl">Score</span>${score == null ? '—' : score.toFixed(1)}</div>
          `}
        </div>`;
    });
    html += '</div>';
    return html;
  }

          <section class="block">
            <h3>Evaluations</h3>
            <div class="eval-columns">
              <div class="eval-card mine">
                <div class="who"><span class="dot" style="background:${colorFor(identity)}"></span>${esc(identity)} (you)</div>
                <div class="rating-scale">
                  <input type="range" min="1" max="10" id="e-rating" value="${mine.rating ?? 5}" />
                  <span class="rval" id="e-rating-val">${mine.rating ?? 5}</span>
                </div>
                <div class="pn-cols">
                  <div class="field"><label>Positives (one per line)</label><textarea id="e-positives">${esc((mine.positives || []).join('\n'))}</textarea></div>
                  <div class="field"><label>Negatives (one per line)</label><textarea id="e-negatives">${esc((mine.negatives || []).join('\n'))}</textarea></div>
                </div>
                <div class="field"><label>Notes</label><textarea id="e-notes">${esc(mine.notes || '')}</textarea></div>
                <div class="row-actions"><button class="primary" id="save-eval">Save my evaluation</button></div>
              </div>
              ${others.length ? others.map(o => `
                <div class="eval-card">
                  <div class="who"><span class="dot" style="background:${colorFor(o.person)}"></span>${esc(o.person)}</div>
                  <div class="rating-scale"><span class="rval">${o.rating ?? '–'} / 10</span></div>
                  ${(o.positives || []).length ? `<ul class="pn-list pos">${o.positives.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
                  ${(o.negatives || []).length ? `<ul class="pn-list neg">${o.negatives.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
                  ${o.notes ? `<div style="font-size:12.5px; color:var(--ink-soft); white-space:pre-wrap;">${esc(o.notes)}</div>` : ''}
                </div>
              `).join('') : `<div class="eval-card"><div class="empty-eval">Waiting on your co-buyer's evaluation.</div></div>`}
            </div>
          </section>
        </div>
      </div>`;
  }

  function bindDrawer() {
    const ov = document.getElementById('overlay');
    if (ov) ov.onclick = closeDrawer;
    const close = document.getElementById('close-drawer');
    if (close) close.onclick = closeDrawer;
    const cancel = document.getElementById('cancel-add');
    if (cancel) cancel.onclick = closeDrawer;

    const saveAdd = document.getElementById('save-add');
    if (saveAdd) saveAdd.onclick = async () => {
      const address = document.getElementById('f-address').value.trim();
      if (!address) { document.getElementById('f-address').focus(); return; }
      const num = fid => { const v = document.getElementById(fid).value; return v === '' ? null : Number(v); };
      const str = fid => document.getElementById(fid).value.trim() || null;
      saveAdd.disabled = true;
      try {
        await db.collection('houses').add({
          address,
          price: num('f-price'), beds: num('f-beds'), baths: num('f-baths'),
          sqft: num('f-sqft'), lotSize: num('f-lotSize'), yearBuilt: num('f-yearBuilt'),
          hoa: num('f-hoa'), taxes: num('f-taxes'), status: document.getElementById('f-status').value,
          listedDate: str('f-listedDate'),
          zillowUrl: str('f-zillowUrl'), redfinUrl: str('f-redfinUrl'), mlsUrl: str('f-mlsUrl'),
          notes: str('f-notes'), createdAt: Date.now(), sortOrder: Date.now(),
        });
        closeDrawer();
      } catch (e) { alert('Could not save: ' + e.message); saveAdd.disabled = false; }
    };

    const statusSelect = document.getElementById('d-status-select');
    if (statusSelect) statusSelect.onchange = async () => {
      const val = statusSelect.value;
      statusSelect.className = 'status-select status-' + val;
      try { await db.collection('houses').doc(openDrawer.id).update({ status: val }); }
      catch (e) { alert('Could not update status: ' + e.message); }
    };

    const editBtn = document.getElementById('edit-house');
    if (editBtn) editBtn.onclick = () => editHouse(openDrawer.id);

    const toggleDetails = document.getElementById('toggle-edit-details');
    if (toggleDetails) toggleDetails.onclick = () => { openDrawer.editingDetails = !openDrawer.editingDetails; render(); };

    const saveDetails = document.getElementById('save-details');
    if (saveDetails) saveDetails.onclick = async () => {
      saveDetails.disabled = true;
      const num = fid => { const v = document.getElementById(fid).value; return v === '' ? null : Number(v); };
      const agentParts = document.getElementById('d-agent').value.split('|').map(p => p.trim());
      const updates = {
        lotSize: num('d-lotSize'), yearBuilt: num('d-yearBuilt'), hoa: num('d-hoa'), taxes: num('d-taxes'),
        listedDate: document.getElementById('d-listedDate').value.trim() || null,
        schools: parsePipeRows(document.getElementById('d-schools').value, ['name', 'level', 'rating', 'distance']),
        saleHistory: parsePipeRows(document.getElementById('d-history').value, ['date', 'event', 'price']).map(r => ({ ...r, price: r.price ? Number(r.price.replace(/[^0-9.]/g, '')) || r.price : r.price })),
        taxHistory: parsePipeRows(document.getElementById('d-taxhistory').value, ['year', 'tax', 'assessment']),
        agent: agentParts[0] ? { name: agentParts[0] || null, brokerage: agentParts[1] || null, phone: agentParts[2] || null, license: agentParts[3] || null } : null,
      };
      try {
        await db.collection('houses').doc(openDrawer.id).update(updates);
        openDrawer.editingDetails = false;
        render();
      } catch (e) { alert('Could not save: ' + e.message); saveDetails.disabled = false; }
    };
    const delBtn = document.getElementById('delete-house');
    if (delBtn) delBtn.onclick = async () => {
      if (!confirm('Delete this house and its evaluations?')) return;
      await db.collection('houses').doc(openDrawer.id).delete();
      closeDrawer();
    };

    const ratingInput = document.getElementById('e-rating');
    if (ratingInput) ratingInput.oninput = () => { document.getElementById('e-rating-val').textContent = ratingInput.value; };

    const saveEval = document.getElementById('save-eval');
    if (saveEval) saveEval.onclick = async () => {
      saveEval.disabled = true;
      const data = {
        person: identity,
        rating: Number(document.getElementById('e-rating').value),
        positives: linesToArray(document.getElementById('e-positives').value),
        negatives: linesToArray(document.getElementById('e-negatives').value),
        notes: document.getElementById('e-notes').value.trim(),
        updatedAt: Date.now(),
      };
      try {
        await db.collection('houses').doc(openDrawer.id).collection('evaluations').doc(slug(identity)).set(data);
        saveEval.textContent = 'Saved ✓';
        setTimeout(() => { saveEval.textContent = 'Save my evaluation'; saveEval.disabled = false; }, 1200);
      } catch (e) { alert('Could not save: ' + e.message); saveEval.disabled = false; }
    };
  }

  function editHouse(id) {
    const h = houses.get(id);
    const fields = ['price','beds','baths','sqft','zillowUrl','redfinUrl','mlsUrl','notes'];
    const labels = { price:'Price', beds:'Beds', baths:'Baths', sqft:'Sqft', zillowUrl:'Zillow URL', redfinUrl:'Redfin URL', mlsUrl:'MLS URL', notes:'Notes' };
    const updates = {};
    for (const f of fields) {
      const cur = h[f] == null ? '' : h[f];
      const v = prompt(labels[f] + ':', cur);
      if (v === null) continue;
      if (['price','beds','baths','sqft'].includes(f)) {
        updates[f] = v.trim() === '' ? null : Number(v);
      } else {
        updates[f] = v.trim() || null;
      }
    }
    if (Object.keys(updates).length) db.collection('houses').doc(id).update(updates);
  }

  // ---------------- boot ----------------
  async function boot() {
    db = await window.claude.use('db');
    if (!db) {
      app.innerHTML = '<div class="empty-state"><h3>Storage unavailable</h3><p>This view could not connect to shared storage. Try reopening the page.</p></div>';
      return;
    }
    db.collection('houses').onSnapshot(snap => {
      const seen = new Set();
      snap.docs.forEach(d => {
        seen.add(d.id);
        houses.set(d.id, d.data());
        if (!evalUnsubs.has(d.id)) {
          const unsub = db.collection('houses').doc(d.id).collection('evaluations').onSnapshot(esnap => {
            const m = new Map();
            esnap.docs.forEach(ed => m.set(ed.id, ed.data()));
            evaluations.set(d.id, m);
            render();
          }, () => {});
          evalUnsubs.set(d.id, unsub);
        }
      });
      // cleanup removed houses
      for (const id of Array.from(houses.keys())) {
        if (!seen.has(id)) {
          houses.delete(id);
          evaluations.delete(id);
          const u = evalUnsubs.get(id); if (u) u();
          evalUnsubs.delete(id);
          selected.delete(id);
          compareIds = compareIds.filter(x => x !== id);
        }
      }
      ready = true;
      render();
    }, () => { ready = true; render(); });
  }

  render();
  if (identity) boot();
})();
</script>
